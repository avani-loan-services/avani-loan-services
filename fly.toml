# fly.toml app configuration file for AVANI LOAN SERVICES Backend API
# Generated for Phase 5.3.1 Autonomous Production Release

app = 'avani-loan-services-api'
primary_region = 'bom'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '5000'
  APP_MODE = 'production'

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

[[services]]
  internal_port = 5000
  protocol = "tcp"

  [[services.ports]]
    handlers = ["http"]
    port = 80
    force_https = true

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.http_checks]]
    interval = "15s"
    grace_period = "5s"
    method = "get"
    path = "/api/portal/health"
    protocol = "http"
    timeout = "2s"
    tls_skip_verify = false

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

# STATIC OUTBOUND IP CONFIGURATION
# To attach dedicated outbound IPv4 for MongoDB Atlas /32 whitelist:
# 1. flyctl ips allocate-v4 --app avani-loan-services-api
# 2. Assign static egress gateway IP
# 3. Whitelist that specific /32 in Atlas Network Access

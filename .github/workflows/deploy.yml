name: CI/CD — Build & Deploy to Vercel

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: (Optional) Set Vercel envs from GitHub secrets
        if: ${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ENV_KEYS: ${{ secrets.VERCEL_ENV_KEYS }}
          VITE_HUBSPOT_FORM_ID: ${{ secrets.VITE_HUBSPOT_FORM_ID }}
          PABBLY_CONNECT_URL: ${{ secrets.PABBLY_CONNECT_URL }}
          PICKY_ASSIST_URL: ${{ secrets.PICKY_ASSIST_URL }}
          GOOGLE_WEB_APP_URL: ${{ secrets.GOOGLE_WEB_APP_URL }}
          SITE_URL: ${{ secrets.SITE_URL }}
          VITE_HUBSPOT_PORTAL_ID: ${{ secrets.VITE_HUBSPOT_PORTAL_ID }}
          VITE_HUBSPOT_REGION: ${{ secrets.VITE_HUBSPOT_REGION }}
        run: bash scripts/set-vercel-envs.sh

      - name: Inject internal links into markdown
        run: npm run inject:links

      - name: Generate service pages
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: npm run generate:services

      - name: Build
        run: npm run build

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel --prod --confirm --token $VERCEL_TOKEN

      - name: Notify search engines
        run: npm run notify:search-engines
